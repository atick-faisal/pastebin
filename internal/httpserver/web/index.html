<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastebin</title>
  <style>
    body { margin: 1rem; font-family: system-ui, sans-serif; }
    textarea { box-sizing: border-box; width: 100%; height: 75vh; font: 1rem monospace; }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <h1>Pastebin</h1>
  <p>Shared publicly. Changes replace the text for everyone. Maximum size: 10 MiB.</p>
  <p id="status" role="status" aria-live="polite">Connecting…</p>
  <label for="text">Shared text</label>
  <button id="copy" type="button">Copy</button>
  <span id="copy-status" role="status" aria-live="polite"></span>
  <textarea id="text" aria-describedby="status" spellcheck="false" disabled></textarea>
</body>
</html>
